<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Crystal Cacao">
  <title>Crystal Cacao</title>
  <desc>Eine Kakaobohne auf dem schwarzen Etikettgrund der Verpackung.</desc>
  <!--
    ABGELEITET, NICHT ERFUNDEN. Vorlage ist die Verpackung selbst (Shopify-
    Produktbild der Sorte Awake, files/7.png): ein SCHWARZES Etikett auf
    Kraftpapier, darauf goldene Kakaobohnen in einer geoeffneten Schale.
    Dieses Zeichen ist genau dieser Ausschnitt in klein, EINE Bohne auf dem
    Etikettgrund. Es eroeffnet deshalb keine zweite Bildwelt neben der
    Verpackung, sondern zitiert sie.

    FARBEN, an der Verpackung GEMESSEN statt geschaetzt (k-means ueber 6623
    ockrige Pixel des Bohnen-Ausschnitts, Mechanik wie
    pruefungen/farbmessung_verpackung.py):
      Glanz der Bohne  #CDA05B
      Mittelton        #946127
      Schattenkante    #653916
    Der gemessene Glanz liegt rund dE 2 neben dem Bestands-Token
    cc-gold-tief (#C8985A), ist also DERSELBE Ton. Deshalb kommt hier KEIN
    neuer Farbwert dazu: der Verlauf laeuft von cc-gold (#F2BF72) nach
    cc-gold-tief (#C8985A), der Grund ist cc-dunkel (#171310), und die Naht
    traegt die gemessene Schattenkante. Alle drei Tokens stehen in
    app/styles/kakao-seiten.css; ein zweiter Goldton waere ein Verstoss
    gegen akzent_farben_max 1.

    WARUM EINE DUNKLE KACHEL UND KEINE FREIGESTELLTE BOHNE: der Browser-
    Reiter ist im hellen Fenster nahezu weiss und im dunklen nahezu schwarz.
    Eine freigestellte goldene Bohne traegt gegen Weiss nur schwach. Die
    Kachel bringt ihren Kontrast selbst mit und sieht in beiden Faellen
    gleich aus. Die Vorgaengerdatei (Hydrogen-Zeichen) loeste dasselbe
    Problem ueber prefers-color-scheme und kippte Schwarz auf Weiss; das
    braucht diese Fassung nicht, und sie ist damit auch dort richtig, wo ein
    Reiter die Medienabfrage nicht auswertet.

    WARUM SO WENIG DETAIL: bei 16 px stehen rund 250 Pixel zur Verfuegung.
    Getragen wird das Zeichen von drei Dingen, Kachel, Oval und Naht. Die
    Rillen der Verpackungs-Illustration wuerden dort zu Grau verschmieren.
    Die Masse sind an gerasterten Fassungen 16/24/32/48 px gegen vier
    Reiter-Hintergruende geprueft, nicht geschaetzt (Belege im RESULT).
  -->
  <defs>
    <linearGradient id="cc-bohne" x1="7" y1="8" x2="25" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2BF72"/>
      <stop offset="1" stop-color="#C8985A"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="#171310"/>
  <g transform="rotate(-27 16 16)">
    <ellipse cx="16" cy="16" rx="10.8" ry="7.2" fill="url(#cc-bohne)"/>
    <path d="M6.6 14.8c3.0 1.9 5.7 2.6 9.4 2.6s6.4-.7 9.4-2.6"
          fill="none" stroke="#653916" stroke-width="1.9" stroke-linecap="round"/>
  </g>
</svg>
